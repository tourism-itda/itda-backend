plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.itda'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.1.0'
	jjwtVersion = '0.12.6'
	anthropicVersion = '2.34.0'
}

dependencies {
	// web / jpa / validation
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// db
	runtimeOnly 'org.postgresql:postgresql'
	// 로컬 스모크 테스트용 (virtualization 미지원으로 Docker/PG 못 띄울 때 h2 프로파일)
	runtimeOnly 'com.h2database:h2'

	// querydsl (jakarta)
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// Claude API — 추천 촬영지 큐레이션(SpotCurator)에만 사용.
	// 동선 계산은 전부 코드가 하고, LLM 은 코드가 좁힌 후보 중 선택 + 이유 작성만 담당한다.
	// 키가 없으면 점수 1등으로 폴백하므로 이 의존성 없이도 기능은 동작한다.
	implementation "com.anthropic:anthropic-java:${anthropicVersion}"

	// jwt (jjwt)
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q-class 생성 위치
def generatedDir = layout.buildDirectory.dir('generated/querydsl')

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory = generatedDir
}

sourceSets {
	main {
		java {
			srcDirs += generatedDir
		}
	}
}

clean {
	delete generatedDir
}

tasks.named('test') {
	useJUnitPlatform()
}
