spring:
  application:
    name: itda
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 schema.sql로 관리 (Hibernate 자동생성 X)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  sql:
    init:
      mode: always            # schema.sql -> data.sql 순서로 항상 실행
      encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE   # 명세서 raw 포맷(snake_case) 그대로 직렬화/역직렬화
    default-property-inclusion: non_null

# 임시 JWT 설정 — 안시현 인증 파트로 교체 전까지 사용.
# 팀 합의 후 secret / claim-key / algorithm 만 맞추면 됨.
itda:
  jwt:
    secret: "itda-local-dev-secret-key-change-me-please-32bytes-min"
    user-id-claim: "userId"   # userId 를 담는 클레임 키 (팀 합의 필요: sub vs userId)
    # 개발용 토큰 발급이 필요하면 DevTokenController(/dev/token) 사용 (local 프로파일 한정)

  # 하버사인 거리 -> 소요시간 환산에 쓰는 평균 이동속도(km/h)
  distance:
    average-speed-kmh: 25

logging:
  level:
    org.hibernate.SQL: debug
