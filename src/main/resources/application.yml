spring:
  application:
    name: itda

  datasource:
    url: jdbc:postgresql://localhost:5432/itda
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.naver.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}

public-data:
  base-url: https://apis.data.go.kr/B551011/KorService2/
  tar-rlte-url: https://apis.data.go.kr/B551011/TarRlteTarService1/
  api-key: ${PUBLIC_DATA_API_KEY}



tmdb:
  api:
    key: ${TMDB_API_KEY}
    access-token: ${TMDB_ACCESS_TOKEN}
    base-url: https://api.themoviedb.org/3
    
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ap-northeast-2
  s3:
    bucket: itda-official

kakao:
  client-id: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: https://www.itda-travel.com/oauth/kakao/callback
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me

# =====================================================================
# 장소 · 일정/플래너 파트 (권승훈, No.25~32 + 하루 루트)
# =====================================================================
itda:
  # 하버사인 거리 -> 소요시간 환산에 쓰는 평균 이동속도(km/h)
  distance:
    average-speed-kmh: 25

  # 한국 역사 영화 TMDB 자동 수집 설정
  # batch-size: 한 번 수집 시 처리할 최대 신규 영화 편수
  # cron: 스케줄 실행 시각 (초 분 시 일 월 요일)
  # genres: TMDB 장르 ID (36=역사, 10752=전쟁)
  #   구분자 주의 — 쉼표(,)=AND(두 장르 모두), 파이프(|)=OR(둘 중 하나라도).
  #   "역사 또는 전쟁"을 모으려면 파이프를 써야 한다. 쉼표면 "역사이면서 전쟁"만 잡힌다.
  movie-collect:
    batch-size: 10
    cron: "0 0 4 * * *"
    genres: "36|10752"

  # 한국관광공사 TourAPI (KorService2) — 식당/카페 후보를 온디맨드로 조회한다.
  # 위 public-data 와 같은 서비스라 서비스키를 따로 두지 않고 그대로 재사용한다.
  # 키가 없으면 후보가 빈 목록으로 나올 뿐, 앱은 정상 기동한다.
  tour-api:
    base-url: ${public-data.base-url}
    api-key: ${PUBLIC_DATA_API_KEY:}
    num-of-rows: 30

  # 카카오 로컬 API — 장소 검색(앵커 검증 폴백·식당·카페)과 자동차 길찾기에 쓴다.
  #
  # 위 kakao.client-id(로그인)와 <b>다른 앱의 REST 키</b>다. 로그인 앱에는 카카오맵 제품이
  # 꺼져 있어 로컬 API 가 403(OPEN_MAP_AND_LOCAL disabled)을 돌려준다. 그렇다고
  # KAKAO_REST_API_KEY 를 지도 앱 키로 바꾸면 로그인이 그 앱으로 넘어가 깨지므로
  # 환경변수를 분리했다. 두 값을 합치지 말 것.
  #
  # 키가 없으면 후보가 빈 목록으로 나올 뿐, 앱은 정상 기동한다.
  kakao-local:
    rest-api-key: ${KAKAO_MAP_REST_KEY:}
    size: 15

  # 네이버 검색 API(이미지) — 장소 사진의 마지막 수단.
  #
  # 사진 출처 우선순위는 관광API firstimage > 네이버 이미지 검색이다. 카카오 로컬 API 에는
  # 사진 필드가 아예 없어서(place_name/category_name/x/y/place_url 뿐) 카카오로 보충한
  # 식당·카페는 여기가 유일한 경로다. 관광API 가 사진을 안 주는 관광지(실측 약 11%)도 여기로 온다.
  #
  # 키 발급: developers.naver.com > 애플리케이션 등록 > "검색" API 추가 (무료, 하루 25,000건).
  # 키가 없으면 사진 없이 넘어갈 뿐, 앱은 정상 기동한다.
  naver-search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
    display: 10

  # 하루 일정 템플릿: 장소 → 식당(점심) → 카페 → 장소 → 식당(저녁) → 장소
  route:
    # 10:00 시작 + 체류 120/90/60 으로는 마지막 촬영지 도착이 18:22 로 계산됐다.
    # 조선왕릉·박물관은 대부분 18시에 닫으므로 문 닫은 곳에 도착하는 일정이 된다.
    # 시작을 한 시간 당기고 카페 체류를 줄여 마지막 도착을 폐장 전으로 끌어왔다.
    # 대신 저녁 슬롯이 다소 이르게 잡힌다 — 세 곳 + 두 끼 + 카페를 하루에 넣는 한
    # 폐장 시간과 식사 시간을 둘 다 만족시킬 수는 없다.
    day-start: "09:00"
    spot-dwell-minutes: 120
    restaurant-dwell-minutes: 90
    cafe-dwell-minutes: 40
    # 장소의 성질: 이 시각 이후에도 열려 있으면 night_open (영업시간 파싱 기준)
    night-threshold: "20:00"
    # 일정의 상황: 마지막 칸 도착 예상이 이 시각 이후면 night_open 장소를 우대한다.
    late-arrival-threshold: "18:00"
    # 동선이 몇 m 늘어나도 되는가 (타원의 두께). 사용자가 슬라이더로 조정한다.
    default-allowance-meters: 3000
    max-allowance-meters: 20000
    # 지도에 뿌릴 구간별 후보 개수
    candidate-limit: 8
    # 코드가 이만큼으로 좁힌 뒤 Claude 가 그중 하나를 고른다
    curator-shortlist-size: 5
    # 촬영지 자동 선택 점수 가중치 (합이 1이 아니어도 내부에서 정규화한다)
    # night-weight 를 0.1 로 두니 동선 점수에 밀려 폐장한 왕릉이 마지막 칸에 배치됐다.
    # 마지막 칸에만 적용되는 가산점이라 올려도 앞쪽 칸 선택에는 영향이 없다.
    detour-weight: 0.6
    order-weight: 0.3
    night-weight: 0.4
    # 앵커를 한 지역으로 묶는 반경. 인물 연고지가 전국에 흩어져 있을 때
    # 가장 많이 모인 지역 하나만 남기고 나머지는 버린다.
    anchor-cluster-span-meters: 25000
    # 명소 사이 차량 이동시간 상한. 관람·식사·주차 시간은 포함하지 않은 값이다.
    max-leg-duration-seconds: 2400      # 구간당 40분
    max-total-duration-seconds: 4800    # 합계 80분
    # 방문 순서 후보 중 길찾기로 실제 검증할 개수. 순서당 구간 수만큼 호출한다.
    order-verify-attempts: 3
    # 한 루트의 명소끼리 최소한 떨어져 있어야 하는 거리.
    # 수원 화성과 화성행궁(460m)이 나란히 뽑혀 코스가 한 자리에 머문 적이 있다.
    min-spot-separation-meters: 1000

  # 촬영지 큐레이션용 Claude — 선택 기능이라 기본 OFF.
  # 동선·거리·순서·운영시간 판정은 전부 코드가 하고, LLM 은 코드가 좁힌 후보 중
  # 선택 + 이유 작성만 담당한다. 꺼두면 점수 1등이 그대로 선택된다.
  # 켜려면 enabled: true + ANTHROPIC_API_KEY 설정.
  llm:
    enabled: true
    model: claude-haiku-4-5
    api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 1024
