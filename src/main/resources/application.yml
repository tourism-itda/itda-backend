spring:
  application:
    name: itda

  datasource:
    url: jdbc:postgresql://localhost:5432/itda
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.naver.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}

public-data:
  base-url: https://apis.data.go.kr/B551011/KorService2/
  tar-rlte-url: https://apis.data.go.kr/B551011/TarRlteTarService1/
  api-key: ${PUBLIC_DATA_API_KEY}



tmdb:
  api:
    key: ${TMDB_API_KEY}
    access-token: ${TMDB_ACCESS_TOKEN}
    base-url: https://api.themoviedb.org/3
    
kakao:
  client-id: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: https://api.itda-travel.com/api/auth/kakao/callback
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me
