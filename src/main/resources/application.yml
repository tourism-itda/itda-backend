spring:
  application:
    name: itda

  datasource:
    url: jdbc:postgresql://localhost:5432/itda
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # data.sql(플레이스홀더 촬영지 시드)이 Hibernate가 테이블을 만든 "뒤에" 실행되도록 미룬다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      # 실DB(Postgres)라 기본값(embedded 전용)으로는 data.sql이 자동 실행되지 않는다.
      mode: always

  mail:
    host: smtp.naver.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}

public-data:
  base-url: https://apis.data.go.kr/B551011/KorService2/
  tar-rlte-url: https://apis.data.go.kr/B551011/TarRlteTarService1/
  api-key: ${PUBLIC_DATA_API_KEY}



tmdb:
  api:
    key: ${TMDB_API_KEY}
    access-token: ${TMDB_ACCESS_TOKEN}
    base-url: https://api.themoviedb.org/3
    
kakao:
  client-id: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: http://localhost:8080/api/auth/kakao/callback
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me
