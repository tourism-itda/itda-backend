# 로컬 스모크 테스트 전용 프로파일.
# Docker/PostgreSQL 을 못 띄우는 상황에서 기동·매핑 검증용으로만 쓴다.
# 실제 개발/운영은 기본 프로파일(PostgreSQL).
#
#   .\gradlew.bat bootRun "--args=--spring.profiles.active=h2"
#
# ⚠️ 시드 데이터는 아직 없다. 엔티티에서 스키마만 만들고 띄운다.
spring:
  datasource:
    url: jdbc:h2:mem:itda;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  # 메일 계정이 없어도 기동되도록 더미를 채운다. 실제 발송은 당연히 안 된다.
  mail:
    username: "local@example.com"
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console

# 아래 값들은 h2 로 띄울 때 외부 키가 없어도 기동되도록 하는 더미다.
# 기능을 쓰려면 실제 키가 필요하다.
jwt:
  secret: "itda-local-h2-smoke-secret-key-change-me-32bytes-min"

# .env 나 환경변수에 실제 키가 있으면 그걸 쓰고, 없으면 빈 값으로 기동만 한다.
# 빈 값이면 TourApiClient 가 호출을 건너뛰고 빈 목록을 돌려주므로 기동에는 지장이 없다.
public-data:
  api-key: ${PUBLIC_DATA_API_KEY:}

tmdb:
  api:
    key: ""
    access-token: ""

kakao:
  client-id: ""
  client-secret: ""

# AWS SDK 의 S3Presigner 는 빈 문자열 키를 거부한다("Access key ID cannot be blank").
# 빈 값으로 두면 S3Config -> S3Service -> UserController 순으로 기동이 통째로 실패하므로
# 형식만 맞는 더미를 넣는다. 실제 S3 호출은 당연히 실패한다.
aws:
  access-key: "local-h2-dummy-access-key"
  secret-key: "local-h2-dummy-secret-key"
