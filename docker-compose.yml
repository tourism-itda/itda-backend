services:
  postgres:
    image: postgres:16
    container_name: itda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itda
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - itda-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    image: ghcr.io/tourism-itda/itda-backend:latest
    container_name: itda-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      # 지도·검색·길찾기용. 로그인 앱과 다른 앱의 키라 위와 합치면 로그인이 깨진다.
      # .env 에만 있고 여기 없으면 컨테이너에 전달되지 않아 길찾기가 조용히 꺼진다.
      KAKAO_MAP_REST_KEY: ${KAKAO_MAP_REST_KEY}
      # 장소 사진의 마지막 수단(네이버 이미지 검색). 카카오 로컬 API 에는 사진 필드가 없어서
      # 카카오로 보충한 식당·카페는 이 키가 없으면 사진이 계속 빈다.
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itda
    ports:
      - "8080:8080"

volumes:
  itda-postgres-data:
