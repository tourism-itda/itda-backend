services:
  postgres:
    image: postgres:16
    container_name: itda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itda
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - itda-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  app:
    image: ghcr.io/tourism-itda/itda-backend:latest
    container_name: itda-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itda
    ports:
      - "8080:8080"

volumes:
  itda-postgres-data:
