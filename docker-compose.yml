services:
  postgres:
    image: postgres:16
    container_name: itda-postgres
    environment:
      POSTGRES_DB: itda
      POSTGRES_USER: itda
      POSTGRES_PASSWORD: itda1234
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - itda-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itda -d itda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  itda-pgdata:
