<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루트 추천 테스트</title>
<!--
  로컬 개발용 수동 테스트 페이지. 운영에 배포되지 않는다(정적 리소스가 아니라 tools/ 에 둔다).

  실행:
    1) 앱을 띄운다 (기본 8081 가정)
    2) python -m http.server 5173 --directory tools
    3) http://localhost:5173/route-test.html

  포트 5173 을 쓰는 이유: SecurityConfig 의 CORS 허용 목록에 들어 있다.
  file:// 로 열면 Origin 이 null 이라 CORS 에 막힌다.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1c1f23; --muted: #6b7280;
    --accent: #2563eb; --related: #7c3aed; --general: #059669; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px; }
  h1 { margin: 0 0 10px; font-size: 17px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, button, input { font: inherit; padding: 7px 10px; border: 1px solid var(--line);
                          border-radius: 6px; background: #fff; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #fff; color: var(--text); border-color: var(--line); }
  main { display: grid; grid-template-columns: minmax(380px, 1fr) 1.2fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  #map { width: 100%; height: 560px; border-radius: 10px; border: 1px solid var(--line); background: #e9edf2; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eef2f7; color: var(--muted); }
  .chip.ok { background: #e7f6ee; color: #067647; }
  .chip.bad { background: #fdecec; color: #b42318; }
  .slot { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0;
          border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .label { font-size: 12px; color: var(--muted); }
  .name { font-weight: 600; }
  .addr { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
  .badge.rel { background: #f3e8ff; color: var(--related); }
  .badge.gen { background: #e7f6ee; color: var(--general); }
  .empty { color: var(--warn); }
  .cands { margin-top: 8px; display: grid; gap: 6px; }
  .cand { display: flex; justify-content: space-between; gap: 10px; align-items: center;
          border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; cursor: pointer; background: #fff; }
  .cand:hover { border-color: var(--accent); }
  .cand small { color: var(--muted); }
  .src { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #eef2f7; color: var(--muted); }
  .src.tour { background: #e7f0ff; color: #1d4ed8; }
  #log { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted);
         white-space: pre-wrap; max-height: 150px; overflow: auto; margin-top: 10px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>루트 추천 테스트</h1>
  <div class="controls">
    <label>API <input id="api" value="http://localhost:8081" size="22"></label>
    <select id="content"><option>작품 불러오는 중…</option></select>
    <label>허용거리 <input id="allow" type="number" value="3000" step="500" min="0" max="20000" size="6">m</label>
    <button id="go">루트 생성</button>
    <button id="reload" class="ghost">작품 목록 새로고침</button>
  </div>
</header>

<main>
  <section class="card">
    <div id="meta" class="meta"></div>
    <div id="slots"></div>
    <div id="log"></div>
  </section>
  <section>
    <div id="map"></div>
    <p class="note">보라색 = 작품 관련 명소, 초록색 = 일반 명소, 주황색 = 내가 고른 식당·카페.
       선은 명소 사이 직선이며 실제 도로 경로가 아니다.</p>
  </section>
</main>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d48976e8bf2ca579e2edbf0d766295a2&autoload=false"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = () => $('api').value.replace(/\/+$/, '');
let route = null;          // 마지막 루트 응답
const chosen = {};         // visit_order -> 사용자가 고른 후보
let map = null, overlays = [];

function log(msg) { $('log').textContent = msg + '\n' + $('log').textContent; }

// ── 지도 ────────────────────────────────────────────────────────────────
function initMap() {
  if (!window.kakao || !window.kakao.maps) {
    $('map').innerHTML = '<div style="padding:16px;color:#b45309">'
      + '카카오 지도 SDK를 불러오지 못했습니다. 카카오 개발자 콘솔에서 이 앱의 플랫폼에 '
      + '<code>http://localhost:5173</code> 을 등록해야 합니다. 지도 없이도 아래 목록은 동작합니다.</div>';
    return;
  }
  kakao.maps.load(() => {
    map = new kakao.maps.Map($('map'), {
      center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8
    });
    if (route) drawRoute();
  });
}

function clearOverlays() { overlays.forEach(o => o.setMap(null)); overlays = []; }

function pin(lat, lng, text, color) {
  const marker = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(lat, lng),
    content: '<div style="background:' + color + ';color:#fff;padding:3px 8px;border-radius:6px;'
           + 'font:600 12px sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)">'
           + text.replace(/</g, '&lt;') + '</div>',
    yAnchor: 1.3
  });
  marker.setMap(map);
  overlays.push(marker);
}

function drawRoute() {
  if (!map || !route) return;
  clearOverlays();
  const bounds = new kakao.maps.LatLngBounds();
  const path = [];

  route.slots.forEach(s => {
    const p = s.place || chosen[s.visit_order];
    if (!p) return;
    const lat = p.latitude, lng = p.longitude;
    const isSpot = s.slot_type === 'SPOT';
    const color = !isSpot ? '#ea580c' : (s.filled_by === 'GENERAL' ? '#059669' : '#7c3aed');
    pin(lat, lng, p.name, color);
    bounds.extend(new kakao.maps.LatLng(lat, lng));
    if (isSpot) path.push(new kakao.maps.LatLng(lat, lng));
  });

  if (path.length > 1) {
    const line = new kakao.maps.Polyline({
      path, strokeWeight: 3, strokeColor: '#2563eb', strokeOpacity: 0.7, strokeStyle: 'shortdash'
    });
    line.setMap(map);
    overlays.push(line);
  }
  if (!bounds.isEmpty()) map.setBounds(bounds);
}

// ── 작품 목록 ───────────────────────────────────────────────────────────
async function loadContents() {
  const sel = $('content');
  sel.innerHTML = '<option>불러오는 중…</option>';
  try {
    const r = await fetch(api() + '/api/contents?page=0&limit=100');
    const d = await r.json();
    const items = d.data || d.content || [];
    sel.innerHTML = '';
    items.forEach(c => {
      const o = document.createElement('option');
      o.value = c.content_id ?? c.contentId ?? c.id;
      o.textContent = `${c.title} (${o.value})`;
      sel.appendChild(o);
    });
    log(`작품 ${items.length}편 불러옴`);
  } catch (e) {
    sel.innerHTML = '<option>불러오기 실패</option>';
    log('작품 목록 실패: ' + e);
  }
}

// ── 루트 생성 ───────────────────────────────────────────────────────────
async function plan() {
  const contentId = Number($('content').value);
  if (!contentId) return;
  Object.keys(chosen).forEach(k => delete chosen[k]);
  $('slots').innerHTML = '<p class="muted">생성 중…</p>';
  $('meta').innerHTML = '';

  try {
    const r = await fetch(api() + '/api/itineraries/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content_id: contentId, allowance_meters: Number($('allow').value) })
    });
    if (!r.ok) {
      const body = await r.text();
      $('slots').innerHTML = `<p class="empty">루트를 만들 수 없습니다 (HTTP ${r.status})<br>`
        + `<small>${body.replace(/</g, '&lt;').slice(0, 300)}</small></p>`;
      log(`실패 ${r.status}: 이 작품은 관련 명소가 없어 숨김 대상일 수 있습니다`);
      return;
    }
    route = await r.json();
    render();
    drawRoute();
    log(`${route.content_title}: 명소 ${route.spot_count}곳, 출처 ${route.anchor_source}`);
  } catch (e) {
    $('slots').innerHTML = '<p class="empty">요청 실패: ' + e + '</p>';
  }
}

function render() {
  const min = (s) => s == null ? '-' : Math.round(s / 60) + '분';
  const km = (m) => m == null ? '-' : (m / 1000).toFixed(1) + 'km';
  $('meta').innerHTML = [
    `<span class="chip">${route.region ?? '-'}</span>`,
    `<span class="chip">앵커 출처 ${route.anchor_source}</span>`,
    `<span class="chip">명소 ${route.spot_count}곳</span>`,
    `<span class="chip ${route.road_verified ? 'ok' : 'bad'}">`
      + (route.road_verified ? `실측 ${km(route.travel_distance_meters)} / ${min(route.travel_duration_seconds)}`
                             : '길찾기 미검증') + '</span>',
    `<span class="chip ${route.within_time_limits ? 'ok' : 'bad'}">`
      + (route.within_time_limits ? '시간 제한 통과' : '시간 제한 초과') + '</span>'
  ].join('');

  const segByStart = {};
  (route.segments || []).forEach(s => { segByStart[s.segment_index] = s; });

  $('slots').innerHTML = '';
  route.slots.forEach(s => {
    const div = document.createElement('div');
    div.className = 'slot';
    const picked = chosen[s.visit_order];
    const p = s.place || picked;

    let body;
    if (p) {
      const badge = s.slot_type !== 'SPOT'
        ? '<span class="badge gen">내가 고름</span>'
        : (s.filled_by === 'GENERAL' ? '<span class="badge gen">일반 명소</span>'
                                     : '<span class="badge rel">작품 관련</span>');
      body = `<div><span class="name">${p.name}</span>${badge}</div>`
           + `<div class="addr">${p.category ?? ''} · ${p.address ?? ''}</div>`;
      if (s.reason) body += `<div class="addr">“${s.reason}”</div>`;
    } else {
      body = `<div class="empty">비어 있음 — 아래에서 고르세요</div>`
           + `<button class="ghost" data-slot="${s.visit_order}" data-seg="${s.segment_index}" `
           + `data-type="${s.slot_type}">${s.label} 후보 보기</button>`
           + `<div class="cands" id="cands-${s.visit_order}"></div>`;
    }
    div.innerHTML = `<div><div class="time">${(s.estimated_time || '').slice(0, 5)}</div>`
                  + `<div class="label">${s.label}</div></div><div>${body}</div>`;
    $('slots').appendChild(div);
  });

  $('slots').querySelectorAll('button[data-slot]').forEach(b => {
    b.addEventListener('click', () => loadCandidates(b.dataset));
  });
}

// ── 구간 후보 ───────────────────────────────────────────────────────────
async function loadCandidates({ slot, seg, type }) {
  const segment = (route.segments || []).find(s => String(s.segment_index) === String(seg));
  if (!segment) { log('구간 정보를 찾을 수 없습니다'); return; }

  const box = $('cands-' + slot);
  box.innerHTML = '<small>후보 조회 중…</small>';
  const params = new URLSearchParams({
    start_place_id: segment.start_place_id,
    slot_type: type,
    allowance_meters: $('allow').value
  });
  if (segment.end_place_id != null) params.set('end_place_id', segment.end_place_id);

  try {
    const r = await fetch(api() + '/api/itineraries/route/candidates?' + params);
    const d = await r.json();
    const list = d.candidates || [];
    if (!list.length) { box.innerHTML = '<small>후보가 없습니다. 허용거리를 늘려 보세요.</small>'; return; }
    box.innerHTML = '';
    list.forEach(c => {
      const el = document.createElement('div');
      el.className = 'cand';
      const src = c.source === 'TOUR_API'
        ? '<span class="src tour">관광공사</span>' : '<span class="src">카카오</span>';
      const detour = c.detour_known ? `동선 +${c.detour_meters}m` : `${c.detour_meters}m 거리`;
      el.innerHTML = `<div><div>${c.name} ${src}</div>`
                   + `<small>${c.category ?? ''} · ${c.address ?? ''}</small></div>`
                   + `<small>${detour}</small>`;
      el.addEventListener('click', () => {
        chosen[slot] = c;
        log(`${c.name} 선택 (${c.source})`);
        render();
        drawRoute();
      });
      box.appendChild(el);
    });
    log(`${type} 후보 ${list.length}건 (관광공사 ${list.filter(c => c.source === 'TOUR_API').length}건)`);
  } catch (e) {
    box.innerHTML = '<small>조회 실패: ' + e + '</small>';
  }
}

$('go').addEventListener('click', plan);
$('reload').addEventListener('click', loadContents);
loadContents();
initMap();
</script>
</body>
</html>
