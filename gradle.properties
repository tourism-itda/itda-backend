# JAVA_HOME 이 JDK 17 을 가리키는 PC 에서도 툴체인이 21 을 찾도록 설치 경로를 알려준다.
# 존재하지 않는 경로는 Gradle 이 무시하므로, 다른 PC 에서는 이 줄이 있어도 문제되지 않는다.
# JAVA_HOME 이 이미 21 이면 이 설정 없이도 빌드된다.
org.gradle.java.installations.paths=C:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot

# 빌드 편의
org.gradle.caching=true
org.gradle.parallel=true
